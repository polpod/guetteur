[project]
name = "guetteur"
version = "0.1.0"
description = "Surveille des playlists YouTube, résume les nouvelles vidéos avec Claude et envoie le résumé par messagerie."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.8.0",
    "feedparser>=6.0.14",
    "google-auth>=2.58.0",
    "google-auth-oauthlib>=1.4.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    # Parseur YAML des fiches projet (frontmatter). Le parseur maison coupait sur
    # chaque virgule d'une liste `[a, "b, c"]` et cassait les fiches où un sujet
    # de recherche contenait une virgule entre guillemets ; safe_load respecte les
    # règles YAML. Repli sur le parseur maison si le YAML est invalide.
    "pyyaml>=6.0",
    "schedule>=1.2.2",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.8.19",
]

[project.optional-dependencies]
whisper = [
    "faster-whisper>=1.2.1",
]
# NotebookLM : version audit-fixée (voir docs/audit-notebooklm/RAPPORT.md §8-9).
# Aucun autre extra de notebooklm-py : jamais [cookies], [browser], [android], [mcp], [server].
notebooklm = [
    "notebooklm-py==0.8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guetteur"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "types-pyyaml>=6.0.12",
    "types-requests>=2.33.0.20260906",
]

[project.scripts]
guetteur = "guetteur.main:cli"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "C4", "PTH", "RET"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = [
    "feedparser.*",
    "yt_dlp.*",
    "faster_whisper.*",
    "google_auth_oauthlib.*",
    "notebooklm.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
